services:
  - type: web
    name: skycoin4444-beta
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /api/beta/readiness
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOCAL_TEST_MODE
        value: "false"
      - key: BETA_ACCESS_MODE
        value: invite_only
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_CONNECTION_LIMIT
        value: "10"
      - key: DB_POOL_MAX_IDLE
        value: "10"
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: "60000"
      - key: DB_POOL_QUEUE_LIMIT
        value: "256"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: DB_KEEP_ALIVE_INITIAL_DELAY_MS
        value: "0"
      - key: HTTP_MAX_HEADERS_COUNT
        value: "128"
      - key: HTTP_MAX_CONNECTIONS
        value: "256"
      - key: JWT_SECRET
        sync: false
      - key: JWT_SECRET_PREVIOUS
        sync: false
      - key: SESSION_TTL_MS
        value: "604800000"
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: BETA_PUBLIC_ORIGIN
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: BETA_ALLOWED_EMAILS
        sync: false
      - key: BETA_ALLOWED_OPEN_IDS
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false

# Install only after DNS ownership, certificate paths, and the EC2 upstream are confirmed.
# Canonical strategy: skycoin4444.com is canonical; the other approved hosts redirect to it.

upstream skycoin4444_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name skycoin4444.com skycoin4444.net skycoin4444.shop skycoin44.token;
    return 301 https://skycoin4444.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skycoin4444.net skycoin4444.shop skycoin44.token;

    ssl_certificate /etc/letsencrypt/live/skycoin4444.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skycoin4444.com/privkey.pem;

    return 301 https://skycoin4444.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skycoin4444.com;

    ssl_certificate /etc/letsencrypt/live/skycoin4444.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skycoin4444.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 50m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
        proxy_pass http://skycoin4444_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://skycoin4444_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

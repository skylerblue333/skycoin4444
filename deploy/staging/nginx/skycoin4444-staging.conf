# Replace staging.skycoin4444.com only after a real staging hostname is authorized and configured.
# This file is a template and is not operational evidence.

upstream skycoin4444_staging_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.skycoin4444.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.skycoin4444.com;

    ssl_certificate /etc/letsencrypt/live/staging.skycoin4444.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.skycoin4444.com/privkey.pem;

    client_max_body_size 50m;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://skycoin4444_staging_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

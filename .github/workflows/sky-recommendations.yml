name: SkyRecommendations

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/sky-recommendations/**"
      - ".github/workflows/sky-recommendations.yml"
      - "tsconfig.packages.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "packages/sky-recommendations/**"
      - ".github/workflows/sky-recommendations.yml"
      - "tsconfig.packages.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package typecheck
        run: pnpm run check:packages
      - name: SkyRecommendations tests
        run: pnpm exec vitest run --config packages/sky-recommendations/vitest.config.ts
      - name: Critical production dependency audit
        run: pnpm audit --prod --audit-level=critical

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

name: SkySessions CI

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/sky-sessions/**"
      - "tsconfig.packages.json"
      - ".github/workflows/sky-sessions.yml"
  push:
    branches: [main]
    paths:
      - "packages/sky-sessions/**"
      - "tsconfig.packages.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict package typecheck
        run: pnpm run check:packages
      - name: Deterministic SkySessions tests
        run: pnpm exec vitest run packages/sky-sessions/src/index.test.ts
      - name: Formatting gate
        run: pnpm exec prettier --check packages/sky-sessions
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=critical

name: SkyCDNPolicy

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/sky-cdn-policy/**"
      - ".github/workflows/sky-cdn-policy.yml"
      - "tsconfig.packages.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "packages/sky-cdn-policy/**"
      - ".github/workflows/sky-cdn-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --config packages/sky-cdn-policy/vitest.config.ts
      - run: pnpm exec tsc --ignoreConfig --noEmit --module nodenext --moduleResolution nodenext --target es2022 packages/sky-cdn-policy/src/index.ts
      - run: pnpm audit --prod --audit-level=critical

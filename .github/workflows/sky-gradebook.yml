name: SkyGradebook CI

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/sky-gradebook/**"
      - "tsconfig.packages.json"
      - ".github/workflows/sky-gradebook.yml"
  push:
    branches: [main]
    paths:
      - "packages/sky-gradebook/**"
      - "tsconfig.packages.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict package typecheck
        run: pnpm run check:packages
      - name: Deterministic gradebook tests
        run: pnpm exec vitest run --config packages/sky-gradebook/vitest.config.ts
      - name: Formatting gate
        run: pnpm exec prettier --check packages/sky-gradebook
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=critical

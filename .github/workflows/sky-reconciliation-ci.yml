name: sky-reconciliation-ci

on:
  pull_request:
    paths:
      - "packages/sky-reconciliation/**"
      - ".github/workflows/sky-reconciliation-ci.yml"
      - "pnpm-lock.yaml"
      - "tsconfig.packages.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skycoin/sky-reconciliation test
      - run: pnpm run check:packages
      - name: Diagnose Prettier diff
        run: |
          pnpm exec prettier --write packages/sky-reconciliation
          git diff -- packages/sky-reconciliation
          git diff --quiet -- packages/sky-reconciliation
      - run: pnpm audit --audit-level high

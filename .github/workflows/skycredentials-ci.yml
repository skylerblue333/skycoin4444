name: SkyCredentials CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server/features/credentials/**"
      - "docs/products/116-skycredentials.md"
      - ".github/workflows/skycredentials-ci.yml"

permissions:
  contents: read

jobs:
  skycredentials-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: |
          pnpm exec prettier --write server/features/credentials/skyCredentials.ts server/features/credentials/skyCredentials.test.ts docs/products/116-skycredentials.md .github/workflows/skycredentials-ci.yml
          git diff --exit-code -- server/features/credentials/skyCredentials.ts server/features/credentials/skyCredentials.test.ts docs/products/116-skycredentials.md .github/workflows/skycredentials-ci.yml
      - name: Targeted tests
        run: pnpm exec vitest run server/features/credentials/skyCredentials.test.ts
      - name: Typecheck
        run: pnpm run check
      - name: Production build
        run: pnpm run build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=critical

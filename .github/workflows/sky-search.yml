name: SkySearch

on:
  pull_request:
    paths:
      - "packages/sky-search/**"
      - ".github/workflows/sky-search.yml"
  push:
    branches: [main]
    paths:
      - "packages/sky-search/**"
      - ".github/workflows/sky-search.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --config packages/sky-search/vitest.config.ts
      - run: pnpm exec tsc --ignoreConfig --noEmit --module nodenext --moduleResolution nodenext --target es2022 packages/sky-search/src/index.ts

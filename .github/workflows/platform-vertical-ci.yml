name: Platform Vertical CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server/features/platformVertical/**"
      - "server/features/auth/**"
      - "server/features/permissions/**"
      - "server/features/credentials/**"
      - "server/features/payments/**"
      - "packages/skyidentity/**"
      - "packages/sky-mfa/**"
      - "packages/sky-audit/**"
      - "docs/integration/platform-vertical-v1.md"
      - ".github/workflows/platform-vertical-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.packages.json"
  push:
    branches: [main]
    paths:
      - "server/features/platformVertical/**"
      - "server/features/auth/**"
      - "server/features/permissions/**"
      - "server/features/credentials/**"
      - "server/features/payments/**"
      - "packages/skyidentity/**"
      - "packages/sky-mfa/**"
      - "packages/sky-audit/**"
      - "docs/integration/platform-vertical-v1.md"
      - ".github/workflows/platform-vertical-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Targeted integration tests
        run: pnpm exec vitest run server/features/platformVertical/index.test.ts
      - name: Repository typecheck
        run: pnpm run check
      - name: Package typecheck
        run: pnpm run check:packages
      - name: Production build
        run: pnpm run build
      - name: High-severity production dependency audit
        run: node scripts/audit-production-dependencies.mjs

name: SkyNFTCore
on:
  pull_request:
    branches: [main]
    paths: ["packages/sky-nft-core/**", ".github/workflows/sky-nft-core.yml", "tsconfig.packages.json", "pnpm-lock.yaml"]
  push:
    branches: [main]
    paths: ["packages/sky-nft-core/**", ".github/workflows/sky-nft-core.yml", "tsconfig.packages.json"]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.20.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:packages
      - run: pnpm exec vitest run --config packages/sky-nft-core/vitest.config.ts
      - run: pnpm audit --prod --audit-level=critical
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions: { contents: read, pull-requests: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

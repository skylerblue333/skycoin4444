name: skyobservability-ci
on:
  pull_request:
    paths:
      - "packages/skyobservability/**"
      - ".github/workflows/skyobservability.yml"
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skycoin/skyobservability test
      - run: pnpm run check:packages
      - run: pnpm --filter @skycoin/skyobservability format:check

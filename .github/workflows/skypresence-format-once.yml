name: SkyPresence One-Shot Formatter

on:
  push:
    branches:
      - hardening/skypresence-strict-instants-20260830
    paths:
      - packages/sky-presence/**
      - .github/workflows/skypresence-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/skypresence-strict-instants-20260830
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/sky-presence
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- packages/sky-presence; then
            echo 'SkyPresence files already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sky-presence
          git commit -m 'style: apply SkyPresence formatter output'
          git push

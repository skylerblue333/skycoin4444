name: Temporary SkyConsent Formatter

on:
  push:
    branches:
      - hardening/skyconsent-boundaries-20260830

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/skyconsent-boundaries-20260830
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/sky-consent/src/index.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet -- packages/sky-consent/src/index.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sky-consent/src/index.ts
          git commit -m "style: format SkyConsent hardening"
          git push origin HEAD:hardening/skyconsent-boundaries-20260830

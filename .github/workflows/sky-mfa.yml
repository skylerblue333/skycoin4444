name: SkyMFA

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/sky-mfa/**'
      - 'tsconfig.packages.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/sky-mfa/**'
      - 'tsconfig.packages.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package typecheck
        run: pnpm run check:packages
      - name: SkyMFA tests
        run: pnpm vitest run packages/sky-mfa/src/index.test.ts

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

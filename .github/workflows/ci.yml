name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Package workspace typecheck
        run: pnpm run check:packages
      - name: Canonical code lint
        run: pnpm run lint
      - name: Current-tree credential pattern scan
        run: pnpm run check:secrets
      - name: Engineering-beta marker audit
        run: pnpm run audit:markers
      - name: Test
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: High-severity production dependency audit
        run: pnpm audit --prod --audit-level high

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Package workspace typecheck
        run: pnpm run check:packages
      - name: Canonical code lint diagnostic
        id: canonical_lint
        shell: bash
        run: |
          set +e
          pnpm run lint > eslint-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat eslint-output.txt
          exit 0
      - name: Upload canonical lint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-eslint-output
          path: eslint-output.txt
          if-no-files-found: error
      - name: Enforce canonical code lint
        if: steps.canonical_lint.outputs.status != '0'
        run: exit 1
      - name: Current-tree credential pattern scan
        run: pnpm run check:secrets
      - name: Engineering-beta marker audit
        run: pnpm run audit:markers
      - name: Unit and package tests
        run: pnpm test
      - name: Engineering-beta integration tests
        run: pnpm run test:integration
      - name: Production build
        run: pnpm run build
      - name: High-severity production dependency audit
        run: pnpm audit --prod --audit-level high

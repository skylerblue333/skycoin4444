name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Package workspace typecheck
        run: pnpm run check:packages
      - name: Canonical code lint diagnostic
        id: canonical_lint
        continue-on-error: true
        run: pnpm --dir tools/eslint exec eslint ../../server ../../packages ../../scripts --config eslint.config.mjs --max-warnings 0 --format json --output-file ../../eslint-report.json
      - name: Upload canonical lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-eslint-report
          path: eslint-report.json
          if-no-files-found: warn
      - name: Enforce canonical code lint
        if: steps.canonical_lint.outcome == 'failure'
        run: exit 1
      - name: Current-tree credential pattern scan
        run: pnpm run check:secrets
      - name: Engineering-beta marker audit
        run: pnpm run audit:markers
      - name: Unit and package tests
        run: pnpm test
      - name: Engineering-beta integration tests
        run: pnpm run test:integration
      - name: Production build
        run: pnpm run build
      - name: High-severity production dependency audit
        run: pnpm audit --prod --audit-level high

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked-file whitespace
        run: git diff --check

      - name: Check required project files
        run: |
          test -f package.json
          test -f pnpm-lock.yaml
          test -f tsconfig.json
          test -f client/src/App.tsx

      - name: Report build status boundary
        run: |
          echo "Repository integrity checks passed."
          echo "Frontend typecheck/build remains a separate follow-up because this branch contains unresolved pre-existing modules."
